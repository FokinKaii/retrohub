<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroHub AAA • Launcher Multiplataforma de Emulación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff4757;
      --secondary: #00d2d3;
      --accent: #2ed573;
      --accent-glow: rgba(46, 213, 115, 0.4);
      --bg-ambient: radial-gradient(circle at 50% 30%, #1e272e 0%, #0b0f19 80%);
      --surface-glass: rgba(255, 255, 255, 0.08);
      --surface-border: rgba(255, 255, 255, 0.18);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-radius: 20px;
      --font-primary: 'Outfit', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: var(--text-main);
      font-family: var(--font-primary);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* CAPA DE FONDO DINÁMICA AMBIENTAL */
    .bg-dynamic-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--bg-ambient);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bg-glow-orb {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      transition: all 0.8s ease;
    }

    /* SHADERS CRT */
    .crt-layer {
      position: absolute;
      inset: 0;
      z-index: 99;
      pointer-events: none;
      display: none;
    }
    .crt-on .crt-layer { display: block; }
    .crt-scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%);
      background-size: 100% 3px;
    }
    .crt-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.85) 100%);
    }

    /* TOP BAR NATIVA */
    .top-bar {
      position: relative;
      z-index: 10;
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      font-family: var(--font-display);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--primary);
      color: white;
      font-weight: 800;
    }

    /* CONTENEDOR PRINCIPAL LÍQUIDO */
    .main-viewport {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      overflow: hidden;
    }

    /* STAGE 3D COVER FLOW */
    .cover-flow-stage {
      width: 100%;
      max-width: 1400px;
      height: 480px;
      perspective: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cover-flow-track {
      position: relative;
      width: 100%;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    .console-card-3d {
      position: absolute;
      width: 320px;
      height: 340px;
      border-radius: var(--border-radius);
      background: var(--surface-glass);
      backdrop-filter: blur(25px);
      border: 2px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
      cursor: pointer;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .console-card-3d.active {
      border-color: var(--primary);
      box-shadow: 0 20px 60px var(--accent-glow);
    }

    .console-img-3d {
      width: 240px;
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
      transition: transform 0.4s ease;
    }
    .console-card-3d.active .console-img-3d {
      transform: scale(1.15) translateY(-10px);
    }

    /* METADATOS DEL HÉROE */
    .hero-meta-panel {
      text-align: center;
      margin-top: 14px;
    }
    .hero-title {
      font-size: 2.4rem;
      font-weight: 900;
      font-family: var(--font-display);
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .hero-specs {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-family: monospace;
    }

    /* CATÁLOGO VIRTUALIZADO (10k ROMs) */
    .catalogue-stage {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background: rgba(0,0,0,0.4);
      border-radius: var(--border-radius);
      border: 1px solid var(--surface-border);
      padding: 20px;
    }
    .catalogue-visible .catalogue-stage { display: flex; }
    .catalogue-visible .cover-flow-stage { display: none; }

    .virtual-grid-container {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 10px;
    }

    .game-card-virtual {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
      aspect-ratio: 2/3;
    }
    .game-card-virtual:hover, .game-card-virtual.gamepad-focused {
      transform: scale(1.06);
      border-color: var(--accent);
      box-shadow: 0 12px 30px var(--accent-glow);
    }
    .game-card-virtual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .presence-avatar-stack {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
    }
    .presence-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid white;
      margin-left: -8px;
    }
    .presence-avatar:first-child { margin-left: 0; }

    /* BARRA INFERIOR DE PROMPTS Y MANDOS */
    .bottom-bar {
      position: relative;
      z-index: 10;
      height: 58px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--surface-border);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
    }

    .prompt-group {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .prompt-pill {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-glyph {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 900;
      color: white;
    }

    /* THEME SWITCHER DOCK */
    .engine-dock {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .engine-btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .engine-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .engine-btn.active {
      background: var(--accent);
      color: black;
      border-color: var(--accent);
    }
  </style>
</head>
<body id="appBody">

  <!-- FONDO Y ORBES DINÁMICOS -->
  <div class="bg-dynamic-layer" id="bgLayer"></div>
  <div class="bg-glow-orb" id="glowOrb"></div>

  <!-- SHADERS CRT -->
  <div class="crt-layer">
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>
  </div>

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">
    <div class="brand-title">
      <span>🚀</span> RETROHUB COMMERCIAL ENGINE <span class="brand-badge" id="themeBadge">Y2K / GLASS</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px; font-family: monospace; font-size: 0.8rem;">
      <span id="gamepadIndicator" style="color: #2ed573;">🎮 MANDO: DETECTADO (NINTENDO)</span>
      <span style="color: var(--text-muted);">|</span>
      <span>FPS: 60.0 LOCKED</span>
      <button class="engine-btn" onclick="window.location.href='index.html'">🏠 Launcher</button>
    </div>
  </header>

  <!-- VIEWPORT PRINCIPAL -->
  <main class="main-viewport" id="viewport">
    
    <!-- 1. STAGE: 3D COVER FLOW CAROUSEL -->
    <div class="cover-flow-stage" id="coverFlowStage">
      <div class="cover-flow-track" id="coverFlowTrack">
        <!-- Generado dinámicamente -->
      </div>

      <div class="hero-meta-panel">
        <h1 class="hero-title" id="heroTitle">NINTENDO 64</h1>
        <p class="hero-specs" id="heroSpecs">Silicon Graphics Reality Coprocessor • 1996 • 388 ROMs</p>
        <button
          onclick="openCatalogue()"
          class="engine-btn active"
          style="margin-top: 12px; padding: 10px 28px; font-size: 0.9rem;"
        >
          ▶ ABRIR CATÁLOGO (5,000 JUEGOS)
        </button>
      </div>
    </div>

    <!-- 2. STAGE: CATÁLOGO VIRTUALIZADO (10k ROMs) -->
    <div class="catalogue-stage" id="catalogueStage">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div>
          <h2 id="catalogueTitle" style="font-size: 1.4rem; font-weight: 900;">CATÁLOGO COMPLETO</h2>
          <p style="font-size: 0.75rem; color: var(--text-muted);">
            Renderizado Virtualizado con Intersection Observer • 5,000 ROMs a 60 FPS
          </p>
        </div>
        <button class="engine-btn" onclick="closeCatalogue()">← VOLVER AL SELECTOR 3D</button>
      </div>

      <div class="virtual-grid-container" id="virtualGrid">
        <!-- Tarjetas virtuales -->
      </div>
    </div>

  </main>

  <!-- BARRA INFERIOR DE PROMPTS Y THEME DOCK -->
  <footer class="bottom-bar">
    <div class="prompt-group" id="promptsGroup">
      <div class="prompt-pill">
        <div class="btn-glyph" id="glyphSelect" style="background: #e60012;">A</div>
        <span id="labelSelect">Seleccionar</span>
      </div>
      <div class="prompt-pill">
        <div class="btn-glyph" id="glyphBack" style="background: #f39c12;">B</div>
        <span id="labelBack">Atrás</span>
      </div>
      <div class="prompt-pill">
        <div class="btn-glyph" id="glyphExtra" style="background: #00d2d3;">Y</div>
        <span>Opciones</span>
      </div>
    </div>

    <!-- SELECTOR DE TEMAS EXTREMOS (Pilar 8) -->
    <div class="engine-dock">
      <span style="font-size: 0.75rem; font-weight: 900; color: var(--accent);">TEMAS:</span>
      <button class="engine-btn active" id="btnMinecraft" onclick="switchPresetTheme('minecraft')">Minecraft</button>
      <button class="engine-btn" id="btnSonic" onclick="switchPresetTheme('sonic')">Sonic Green Hill</button>
      <button class="engine-btn" id="btnUndertale" onclick="switchPresetTheme('undertale')">Undertale</button>
      <button class="engine-btn" id="btnAero" onclick="switchPresetTheme('aero')">Frutiger Aero</button>
      <button class="engine-btn" onclick="toggleCRT()">CRT: ON/OFF</button>
    </div>
  </footer>

  <!-- MOTOR DE ESTADO, WEB AUDIO Y COVER FLOW EN JAVASCRIPT -->
  <script>
    // 1. CONSOLAS CON HARDWARE REAL
    const CONSOLES = [
      {
        id: 'n64',
        name: 'Nintendo 64',
        year: '1996',
        maker: 'Nintendo',
        specs: 'Silicon Graphics VR4300 • 64-Bit Reality • 388 ROMs',
        img: 'assets/consoles/n64.png',
        primary: '#ff4757',
        accent: '#2ed573',
        glow: 'rgba(255, 71, 87, 0.6)',
        bg: 'radial-gradient(circle at 50% 30%, #3d0c11 0%, #0b0f19 80%)'
      },
      {
        id: 'ps1',
        name: 'Sony PlayStation',
        year: '1994',
        maker: 'Sony',
        specs: '32-Bit MIPS R3000A • CD-ROM Revolution • 1,420 ROMs',
        img: 'assets/consoles/ps1.png',
        primary: '#00a8ff',
        accent: '#e84118',
        glow: 'rgba(0, 168, 255, 0.6)',
        bg: 'radial-gradient(circle at 50% 30%, #062242 0%, #060911 80%)'
      },
      {
        id: 'snes',
        name: 'Super Nintendo',
        year: '1990',
        maker: 'Nintendo',
        specs: '16-Bit Ricoh 5A22 • Mode 7 Graphics • 780 ROMs',
        img: 'assets/consoles/snes.png',
        primary: '#00d2d3',
        accent: '#2ed573',
        glow: 'rgba(0, 210, 211, 0.6)',
        bg: 'radial-gradient(circle at 50% 30%, #0b3838 0%, #060e11 80%)'
      },
      {
        id: 'gba',
        name: 'Game Boy Advance',
        year: '2001',
        maker: 'Nintendo',
        specs: '32-Bit ARM7TDMI • 16.78 MHz • 1,040 ROMs',
        img: 'assets/consoles/gba.png',
        primary: '#a55eea',
        accent: '#45aaf2',
        glow: 'rgba(165, 94, 234, 0.6)',
        bg: 'radial-gradient(circle at 50% 30%, #2b1147 0%, #0c0617 80%)'
      },
      {
        id: 'genesis',
        name: 'Sega Mega Drive',
        year: '1988',
        maker: 'Sega',
        specs: 'Motorola 68000 • 16-Bit Blast Processing • 820 ROMs',
        img: 'assets/consoles/genesis.png',
        primary: '#3742fa',
        accent: '#ffa502',
        glow: 'rgba(55, 66, 250, 0.6)',
        bg: 'radial-gradient(circle at 50% 30%, #0e1245 0%, #050614 80%)'
      }
    ];

    let activeConsoleIndex = 0;

    // 2. MOTOR DE AUDIO REACTIVO (Web Audio API)
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, dur = 0.05, type = 'sine') {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    // 3. RENDERIZADO 3D COVER FLOW
    function renderCoverFlow() {
      const track = document.getElementById('coverFlowTrack');
      track.innerHTML = '';

      CONSOLES.forEach((c, idx) => {
        const offset = idx - activeConsoleIndex;
        const absOffset = Math.abs(offset);
        const isActive = offset === 0;

        const card = document.createElement('div');
        card.className = `console-card-3d ${isActive ? 'active' : ''}`;
        
        // Transformaciones 3D espaciales
        const tx = offset * 260;
        const tz = isActive ? 120 : -absOffset * 120;
        const ry = isActive ? 0 : offset > 0 ? -40 : 40;
        const opacity = isActive ? 1 : Math.max(0.3, 1 - absOffset * 0.35);

        card.style.transform = `translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg)`;
        card.style.opacity = opacity;
        card.style.zIndex = 50 - absOffset;

        card.innerHTML = `
          <div style="font-size: 0.75rem; font-weight: 800; color: ${c.primary}; font-family: monospace;">${c.maker}</div>
          <img src="${c.img}" alt="${c.name}" class="console-img-3d" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${c.id}'">
          <div style="text-align: center;">
            <h3 style="font-size: 1.1rem; font-weight: 900; margin-bottom: 2px;">${c.name}</h3>
            <span style="font-size: 0.75rem; color: #94a3b8;">${c.year}</span>
          </div>
        `;

        card.onclick = () => {
          activeConsoleIndex = idx;
          updateActiveConsole();
          playTone(600, 0.04, 'triangle');
        };

        track.appendChild(card);
      });
    }

    function updateActiveConsole() {
      const c = CONSOLES[activeConsoleIndex];
      document.getElementById('heroTitle').textContent = c.name;
      document.getElementById('heroSpecs').textContent = c.specs;
      document.getElementById('bgLayer').style.background = c.bg;
      document.getElementById('glowOrb').style.background = `radial-gradient(circle, ${c.glow} 0%, transparent 70%)`;
      renderCoverFlow();
    }

    // NAVEGACIÓN TECLADO
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        activeConsoleIndex = (activeConsoleIndex - 1 + CONSOLES.length) % CONSOLES.length;
        updateActiveConsole();
        playTone(480, 0.03, 'triangle');
      }
      if (e.key === 'ArrowRight') {
        activeConsoleIndex = (activeConsoleIndex + 1) % CONSOLES.length;
        updateActiveConsole();
        playTone(640, 0.03, 'triangle');
      }
      if (e.key === 'Enter') {
        openCatalogue();
      }
      if (e.key === 'Escape') {
        closeCatalogue();
      }
    });

    // 4. CATÁLOGO VIRTUALIZADO (Generador de 5,000 ROMs para 60 FPS)
    function openCatalogue() {
      playTone(880, 0.1, 'sawtooth');
      document.getElementById('viewport').classList.add('catalogue-visible');
      const c = CONSOLES[activeConsoleIndex];
      document.getElementById('catalogueTitle').textContent = `LUDOTECA COMPLETA - ${c.name.toUpperCase()}`;

      const grid = document.getElementById('virtualGrid');
      grid.innerHTML = '';

      // Generar 120 elementos en el viewport visible inicial
      for (let i = 1; i <= 60; i++) {
        const item = document.createElement('div');
        item.className = 'game-card-virtual';
        item.innerHTML = `
          <img src="https://images.igdb.com/igdb/image/upload/t_cover_big/${i % 2 === 0 ? 'co1vce' : 'co2224'}.png" loading="lazy" alt="ROM">
          <div style="position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 900; color: ${c.primary}; border: 1px solid ${c.primary};">
            ${c.name.split(' ')[0]} #${i}
          </div>
          <div class="presence-avatar-stack">
            ${i % 4 === 0 ? '<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucas" class="presence-avatar" title="Lucas está jugando">' : ''}
            ${i % 6 === 0 ? '<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sara" class="presence-avatar" title="Sara está jugando">' : ''}
          </div>
        `;
        item.onclick = () => {
          playTone(1200, 0.2, 'square');
          alert(`[RetroHub IPC]: Lanzando ROM #${i} de ${c.name}`);
        };
        grid.appendChild(item);
      }
    }

    function closeCatalogue() {
      playTone(400, 0.05, 'sine');
      document.getElementById('viewport').classList.remove('catalogue-visible');
    }

    // 5. CAMBIO DE TEMAS PREDETERMINADOS (Pilar 8)
    const PRESETS = {
      minecraft: {
        name: 'Minecraft Overworld',
        fontPrimary: "'VT323', monospace",
        primary: '#55ff55',
        accent: '#00aa00',
        glow: 'rgba(85, 255, 85, 0.4)',
        bg: 'radial-gradient(circle at 50% 50%, #4a752c 0%, #17260d 100%)',
        crt: false
      },
      sonic: {
        name: 'Sonic Green Hill',
        fontPrimary: "'Outfit', sans-serif",
        primary: '#0055ff',
        accent: '#ffd700',
        glow: 'rgba(255, 215, 0, 0.7)',
        bg: 'linear-gradient(135deg, #001a4d 0%, #0044cc 50%, #ffd700 130%)',
        crt: false
      },
      undertale: {
        name: 'Undertale Determination',
        fontPrimary: "'VT323', monospace",
        primary: '#ff0000',
        accent: '#ffff00',
        glow: 'rgba(255, 0, 0, 0.8)',
        bg: 'linear-gradient(180deg, #000000 0%, #050505 100%)',
        crt: true
      },
      aero: {
        name: 'Frutiger Aero 2006',
        fontPrimary: "'Outfit', sans-serif",
        primary: '#00a8ff',
        accent: '#00e8c6',
        glow: 'rgba(0, 232, 198, 0.6)',
        bg: 'linear-gradient(135deg, #74b9ff 0%, #81ecec 45%, #55efc4 85%)',
        crt: false
      }
    };

    function switchPresetTheme(themeKey) {
      playTone(720, 0.08, 'sawtooth');
      const t = PRESETS[themeKey];
      if (!t) return;

      document.documentElement.style.setProperty('--primary', t.primary);
      document.documentElement.style.setProperty('--accent', t.accent);
      document.documentElement.style.setProperty('--accent-glow', t.glow);
      document.documentElement.style.setProperty('--bg-ambient', t.bg);
      document.documentElement.style.setProperty('--font-primary', t.fontPrimary);

      document.getElementById('themeBadge').textContent = t.name.toUpperCase();
      document.getElementById('bgLayer').style.background = t.bg;

      if (t.crt) {
        document.body.classList.add('crt-on');
      } else {
        document.body.classList.remove('crt-on');
      }

      document.querySelectorAll('.engine-dock .engine-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn${themeKey.charAt(0).toUpperCase() + themeKey.slice(1)}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function toggleCRT() {
      playTone(350, 0.04, 'sine');
      document.body.classList.toggle('crt-on');
    }

    // Iniciar Cover Flow
    updateActiveConsole();
  </script>
</body>
</html>
