<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iiSU Network • Perfil de Usuario (Nintendo Switch OS)</title>
  
  <!-- Tipografías Oficiales de iiSU & Switch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos del Sistema de Perfil Switch OS + iiSU -->
  <link rel="stylesheet" href="IisuProfile.css">
  
  <!-- React 18 y Babel Standalone para renderizado directo en navegador -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="iisu_cursor.js"></script>
</head>
<body class="profile-body">
  <!-- Contenedor Raíz de React -->
  <div id="profileRoot"></div>

  <!-- Componente React IisuSwitchProfile -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // AURAS BIOLUMINISCENTES iiSU
    const AURA_PALETTES = {
      mint: { id: 'mint', name: 'Mint Cyan', color: '#00d2be', glow: 'rgba(0, 210, 190, 0.45)' },
      scarlet: { id: 'scarlet', name: 'Joy-Con Scarlet', color: '#ff3c28', glow: 'rgba(255, 60, 40, 0.45)' },
      electric: { id: 'electric', name: 'Electric Blue', color: '#00a2ed', glow: 'rgba(0, 162, 237, 0.45)' },
      neon: { id: 'neon', name: 'Neon Purple', color: '#818cf8', glow: 'rgba(129, 140, 248, 0.45)' },
      gold: { id: 'gold', name: 'Retro Gold', color: '#f59e0b', glow: 'rgba(245, 158, 11, 0.45)' }
    };

    // CATÁLOGO OFICIAL DE ACTIVIDAD DE JUEGO (Libretro Official Box Arts)
    const DEFAULT_PLAY_ACTIVITY = [
      { id: 'sm64', title: 'Super Mario 64', system: 'n64', systemName: 'Nintendo 64', cover: 'ROMS/covers/box_sm64.png', minutesPlayed: 1440, lastPlayed: 'Jugado hoy', firstPlayed: 'Hace 2 semanas' },
      { id: 'oot', title: 'The Legend of Zelda: Ocarina of Time', system: 'n64', systemName: 'Nintendo 64', cover: 'ROMS/covers/box_oot.png', minutesPlayed: 2700, lastPlayed: 'Jugado ayer', firstPlayed: 'Hace 1 mes' },
      { id: 'poke_emerald', title: 'Pokémon Esmeralda', system: 'gba', systemName: 'Game Boy Advance', cover: 'ROMS/covers/box_emerald.png', minutesPlayed: 1080, lastPlayed: 'Jugado hace 3 días', firstPlayed: 'Hace 3 semanas' },
      { id: 'papermario', title: 'Paper Mario', system: 'n64', systemName: 'Nintendo 64', cover: 'ROMS/covers/papermario.png', minutesPlayed: 720, lastPlayed: 'Jugado hace 5 días', firstPlayed: 'Hace 1 mes' },
      { id: 'chrono', title: 'Chrono Trigger', system: 'snes', systemName: 'Super Nintendo', cover: 'ROMS/covers/box_chrono.png', minutesPlayed: 480, lastPlayed: 'Jugado hace 1 semana', firstPlayed: 'Hace 2 meses' },
      { id: 'sonic2', title: 'Sonic The Hedgehog 2', system: 'genesis', systemName: 'Sega Mega Drive', cover: 'ROMS/covers/box_sonic2.png', minutesPlayed: 320, lastPlayed: 'Jugado hace 2 semanas', firstPlayed: 'Hace 2 meses' },
      { id: 'sotn', title: 'Castlevania: Symphony of the Night', system: 'ps1', systemName: 'PlayStation 1', cover: 'ROMS/covers/box_sotn.png', minutesPlayed: 900, lastPlayed: 'Jugado hace 3 semanas', firstPlayed: 'Hace 3 meses' }
    ];

    // AMIGOS POR DEFECTO
    const DEFAULT_FRIENDS = [
      { id: 'f_lucas', name: 'Lucas Speedrun', username: 'lucas_retro', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Lucas', online: true, statusText: '🎮 Super Mario 64 (Estrella 112)', statusClass: 'status-online' },
      { id: 'f_peach', name: 'Princess Peach', username: 'peach_kingdom', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Queen', online: true, statusText: '🎮 The Legend of Zelda: OOT', statusClass: 'status-peach' },
      { id: 'f_cyber', name: 'RetroCyber', username: 'cyber_speed', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cyber', online: true, statusText: '🎮 Sonic The Hedgehog 2', statusClass: 'status-online' },
      { id: 'f_alex', name: 'Alex Fox', username: 'alex_fox', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Alex', online: false, statusText: 'Desconectado • Hace 2 horas', statusClass: 'status-offline' }
    ];

    // LOGROS E INSIGNIAS RETRO
    const RETRO_ACHIEVEMENTS = [
      { id: 'ach_64', icon: '👑', title: 'Maestra de los 64-Bits', desc: 'Acumular más de 40 horas jugando en el emulador de Nintendo 64.', progress: '100%', unlocked: true },
      { id: 'ach_save', icon: '💾', title: 'Guardián de la Batería', desc: 'Realizar más de 10 partidas guardadas en la nube SRAM sin corromper datos.', progress: '100%', unlocked: true },
      { id: 'ach_speed', icon: '⏱️', title: 'Speedrunner en Cierres', desc: 'Superar un nivel en menos de 5 minutos en Super Mario 64.', progress: '100%', unlocked: true },
      { id: 'ach_boxes', icon: '📦', title: 'Coleccionista de Cartuchos', desc: 'Inspeccionar y rotar más de 20 cajas físicas 3D en la biblioteca.', progress: '100%', unlocked: true },
      { id: 'ach_net', icon: '🤝', title: 'Amistad Nintendo', desc: 'Vincular tu Clave de Amigo SW y conectar con amigos de la red.', progress: '100%', unlocked: true },
      { id: 'ach_hyrule', icon: '🛡️', title: 'Héroe de Hyrule', desc: 'Obtener la Espada Maestra en Ocarina of Time sin usar trucos.', progress: '75%', unlocked: false }
    ];

    // STOCK AVATARES (OFICIALES Y PORTADAS)
    const STOCK_AVATARS = [
      { id: 'av_sm64', name: 'Super Mario 64', url: 'ROMS/covers/box_sm64.png', type: 'covers' },
      { id: 'av_oot', name: 'Zelda OOT', url: 'ROMS/covers/box_oot.png', type: 'covers' },
      { id: 'av_emerald', name: 'Pokémon Esmeralda', url: 'ROMS/covers/box_emerald.png', type: 'covers' },
      { id: 'av_chrono', name: 'Chrono Trigger', url: 'ROMS/covers/box_chrono.png', type: 'covers' },
      { id: 'av_paper', name: 'Paper Mario', url: 'ROMS/covers/papermario.png', type: 'covers' },
      { id: 'av_metroid', name: 'Super Metroid', url: 'ROMS/covers/box_super_metroid.png', type: 'covers' },
      { id: 'av_sonic', name: 'Sonic 2', url: 'ROMS/covers/box_sonic2.png', type: 'covers' },
      { id: 'av_sotn', name: 'Castlevania SOTN', url: 'ROMS/covers/box_sotn.png', type: 'covers' },
      { id: 'av_n64', name: 'Nintendo 64', url: 'assets/consoles_hires/n64.png', type: 'consoles' },
      { id: 'av_snes', name: 'Super Nintendo', url: 'assets/consoles_hires/snes.png', type: 'consoles' },
      { id: 'av_gba', name: 'Game Boy Advance', url: 'assets/consoles_hires/gba.png', type: 'consoles' },
      { id: 'av_ps1', name: 'PlayStation 1', url: 'assets/consoles_hires/ps1.png', type: 'consoles' },
      { id: 'av_sara', name: 'Sara Retro', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraRetro', type: 'characters' },
      { id: 'av_lucas', name: 'Lucas Fox', url: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Lucas', type: 'characters' },
      { id: 'av_queen', name: 'Pixel Queen', url: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Queen', type: 'characters' },
      { id: 'av_cyber', name: 'Cyber Kidd', url: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cyber', type: 'characters' }
    ];

    const STOCK_BANNERS = [
      { id: 'bn_sm64', name: 'Castillo de Peach (N64)', url: 'assets/game_wallpapers/n64/sm64.png' },
      { id: 'bn_oot', name: 'Valle de Hyrule (N64)', url: 'assets/game_wallpapers/n64/oot.png' },
      { id: 'bn_paper', name: 'Paper Mario Kingdom (N64)', url: 'assets/game_wallpapers/n64/papermario.png' },
      { id: 'bn_chrono', name: 'Época Dorada (SNES)', url: 'assets/game_wallpapers/snes/chrono.png' },
      { id: 'bn_ff7', name: 'Midgar Mako (PS1)', url: 'assets/game_wallpapers/ps1/ff7.png' }
    ];

    function ProfileApp() {
      // Pestaña activa en el riel de navegación Switch
      const [activeTab, setActiveTab] = useState('perfil'); // 'perfil', 'amigos', 'ajustes', 'logros'

      // Datos de perfil
      const [profile, setProfile] = useState({
        id: 2,
        username: localStorage.getItem('retrohub_user_name') || 'Sariwiiwi',
        displayName: localStorage.getItem('retrohub_display_name') || 'Sara Gamer',
        bio: localStorage.getItem('retrohub_user_bio') || 'Coleccionista de joyas en caja original, perseguidora de los 60 FPS y fanática de la era dorada de los 64-bits.',
        avatarUrl: localStorage.getItem('retrohub_user_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraRetro',
        bannerUrl: localStorage.getItem('retrohub_user_banner') || 'assets/game_wallpapers/n64/sm64.png',
        titleHonor: localStorage.getItem('retrohub_honor_title') || '🎮 Maestra de los 64-Bits',
        systemAura: localStorage.getItem('retrohub_aura_id') || 'mint',
        favoriteSystem: localStorage.getItem('retrohub_fav_system') || 'n64',
        friendCode: localStorage.getItem('retrohub_friend_code') || 'SW-4829-1092-4821',
        socialLinks: [
          { id: 'l1', platform: 'discord', title: 'Discord', url: 'https://discord.gg/retrohub', icon: '💬' },
          { id: 'l2', platform: 'twitch', title: 'Twitch', url: 'https://twitch.tv/sariwiiwi', icon: '📺' }
        ]
      });

      // Estados de actividad y amigos
      const [playActivity, setPlayActivity] = useState(DEFAULT_PLAY_ACTIVITY);
      const [friends, setFriends] = useState(DEFAULT_FRIENDS);
      const [addFriendInput, setAddFriendInput] = useState('');
      const [clockText, setClockText] = useState('15:45');

      // Modales y retroalimentación
      const [showQrModal, setShowQrModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [avatarTabFilter, setAvatarTabFilter] = useState('covers');
      const [isSaving, setIsSaving] = useState(false);

      // Validación de nombre de usuario en tiempo real
      const [usernameInput, setUsernameInput] = useState(profile.username);
      const [usernameValidation, setUsernameValidation] = useState({ status: 'available', message: '✓ Confirmado' });
      const debounceTimerRef = useRef(null);
      const fileInputRef = useRef(null);
      const broadcastRef = useRef(null);

      // Inicialización y canales de sincronización
      useEffect(() => {
        // 1. Reloj en tiempo real
        const updateClock = () => {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          setClockText(`${hh}:${mm}`);
        };
        updateClock();
        const clockTimer = setInterval(updateClock, 1000);

        // 2. Cargar Play Activity de localStorage si existe
        try {
          const storedAct = localStorage.getItem('retrohub_play_activity');
          if (storedAct) {
            const parsed = JSON.parse(storedAct);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setPlayActivity(parsed);
            }
          }
        } catch (e) {}

        // 3. Cargar Clave de Amigo permanente si no existe
        let fc = localStorage.getItem('retrohub_friend_code');
        if (!fc || !fc.startsWith('SW-')) {
          const p1 = Math.floor(1000 + Math.random() * 9000);
          const p2 = Math.floor(1000 + Math.random() * 9000);
          const p3 = Math.floor(1000 + Math.random() * 9000);
          fc = `SW-${p1}-${p2}-${p3}`;
          localStorage.setItem('retrohub_friend_code', fc);
        }
        setProfile(p => ({ ...p, friendCode: fc }));

        // 4. Cargar perfil desde la API si está disponible
        fetch(`/api/users/profile/${encodeURIComponent(profile.username)}`)
          .then(r => r.json())
          .then(data => {
            if (data.success && data.user) {
              const u = data.user;
              setProfile(p => ({
                ...p,
                displayName: u.displayName || p.displayName,
                bio: u.bio || p.bio,
                avatarUrl: u.avatarUrl || p.avatarUrl,
                bannerUrl: u.bannerUrl || p.bannerUrl,
                titleHonor: u.titleHonor || p.titleHonor,
                systemAura: u.systemAura || p.systemAura,
                favoriteSystem: u.favoriteSystem || p.favoriteSystem
              }));
              setUsernameInput(u.username || p.username);
            }
          })
          .catch(() => {});

        // 5. Configurar canal de sincronización bidireccional (BroadcastChannel)
        if (typeof BroadcastChannel !== 'undefined') {
          broadcastRef.current = new BroadcastChannel('retrohub_profile_sync');
          broadcastRef.current.onmessage = (event) => {
            if (event.data && event.data.type === 'PLAY_ACTIVITY_UPDATED') {
              setPlayActivity(event.data.activity);
            }
          };
        }

        // 6. Aplicar paleta de Aura activa
        const aura = AURA_PALETTES[profile.systemAura] || AURA_PALETTES.mint;
        document.documentElement.style.setProperty('--system-aura-color', aura.color);
        document.documentElement.style.setProperty('--system-aura-glow', aura.glow);

        return () => {
          clearInterval(clockTimer);
          if (broadcastRef.current) broadcastRef.current.close();
        };
      }, []);

      // Cambiar de Aura en vivo
      const handleSelectAura = (auraKey) => {
        const aura = AURA_PALETTES[auraKey];
        if (!aura) return;
        setProfile(p => ({ ...p, systemAura: auraKey }));
        document.documentElement.style.setProperty('--system-aura-color', aura.color);
        document.documentElement.style.setProperty('--system-aura-glow', aura.glow);
        localStorage.setItem('retrohub_aura_id', auraKey);
        localStorage.setItem('retrohub_aura_color', aura.color);
        localStorage.setItem('retrohub_aura_glow', aura.glow);

        // Notificar al launcher
        if (broadcastRef.current) {
          broadcastRef.current.postMessage({
            type: 'PROFILE_UPDATED',
            systemAura: auraKey,
            systemAuraColor: aura.color,
            systemAuraGlow: aura.glow
          });
        }
        showToast('info', `Aura bioluminiscente cambiada a ${aura.name}.`);
      };

      // Cambiar avatar desde stock
      const handleSelectAvatar = (url) => {
        setProfile(p => ({ ...p, avatarUrl: url }));
        localStorage.setItem('retrohub_user_avatar', url);
        if (broadcastRef.current) {
          broadcastRef.current.postMessage({
            type: 'PROFILE_UPDATED',
            avatarUrl: url
          });
        }
        showToast('success', 'Foto de perfil actualizada.');
      };

      // Cambiar banner
      const handleSelectBanner = (url) => {
        setProfile(p => ({ ...p, bannerUrl: url }));
        localStorage.setItem('retrohub_user_banner', url);
        showToast('success', 'Banner panorámico actualizado.');
      };

      // Subida de imagen personalizada
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async () => {
          const base64 = reader.result;
          setProfile(p => ({ ...p, avatarUrl: base64 }));
          localStorage.setItem('retrohub_user_avatar', base64);
          if (broadcastRef.current) {
            broadcastRef.current.postMessage({
              type: 'PROFILE_UPDATED',
              avatarUrl: base64
            });
          }
          showToast('success', 'Foto personalizada cargada.');
        };
        reader.readAsDataURL(file);
      };

      // Copiar Clave de Amigo al Portapapeles
      const handleCopyFriendCode = () => {
        navigator.clipboard.writeText(profile.friendCode).then(() => {
          showToast('success', `✓ ¡Clave ${profile.friendCode} copiada al portapapeles!`);
        }).catch(() => {
          showToast('info', `Tu clave: ${profile.friendCode}`);
        });
      };

      // Validación de usuario en tiempo real
      const handleUsernameChange = (e) => {
        const val = e.target.value;
        setUsernameInput(val);

        if (!val.trim()) {
          setUsernameValidation({ status: 'invalid', message: '⚠ El nombre no puede estar vacío.' });
          return;
        }
        if (val.length < 3 || val.length > 24) {
          setUsernameValidation({ status: 'invalid', message: '⚠ Entre 3 y 24 caracteres.' });
          return;
        }

        setUsernameValidation({ status: 'checking', message: '⟳ Comprobando...' });
        if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
        debounceTimerRef.current = setTimeout(async () => {
          try {
            const res = await fetch(`/api/users/check-username/${encodeURIComponent(val.trim())}?excludeUserId=${profile.id}`);
            const data = await res.json();
            if (data.available) {
              setUsernameValidation({ status: 'available', message: `✓ ¡@${val} está disponible!` });
            } else {
              setUsernameValidation({ status: 'taken', message: `✗ Ya en uso.` });
            }
          } catch {
            setUsernameValidation({ status: 'available', message: '✓ Formato válido.' });
          }
        }, 300);
      };

      // Añadir amigo por clave de amigo
      const handleAddFriendByCode = (e) => {
        e.preventDefault();
        const code = addFriendInput.trim().toUpperCase();
        if (!code || !code.startsWith('SW-') || code.length < 14) {
          showToast('error', 'Introduce una clave de amigo Switch válida (ej: SW-1234-5678-9012).');
          return;
        }

        const newFriend = {
          id: `friend_${Date.now()}`,
          name: `Jugador ${code.slice(-4)}`,
          username: `sw_player_${code.slice(-4).toLowerCase()}`,
          avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${code}`,
          online: true,
          statusText: '🟢 En línea • Conectado por Clave SW',
          statusClass: 'status-online'
        };

        setFriends(prev => [newFriend, ...prev]);
        setAddFriendInput('');
        showToast('success', `¡Solicitud de amistad enviada con éxito a ${code}!`);
      };

      // Guardar perfil completo en SQLite y LocalStorage
      const handleSaveProfile = async () => {
        setIsSaving(true);
        const payload = {
          userId: profile.id,
          username: usernameInput.trim() || profile.username,
          displayName: profile.displayName.trim() || profile.username,
          bio: profile.bio,
          avatarUrl: profile.avatarUrl,
          bannerUrl: profile.bannerUrl,
          titleHonor: profile.titleHonor,
          systemAura: profile.systemAura,
          favoriteSystem: profile.favoriteSystem,
          socialLinks: profile.socialLinks
        };

        try {
          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setProfile(p => ({
              ...p,
              username: payload.username,
              displayName: payload.displayName
            }));
            localStorage.setItem('retrohub_user_name', payload.username);
            localStorage.setItem('retrohub_display_name', payload.displayName);
            localStorage.setItem('retrohub_user_bio', payload.bio);
            localStorage.setItem('retrohub_user_avatar', payload.avatarUrl);
            localStorage.setItem('retrohub_user_banner', payload.bannerUrl);
            localStorage.setItem('retrohub_honor_title', payload.titleHonor);
            localStorage.setItem('retrohub_fav_system', payload.favoriteSystem);

            // Sincronizar con el launcher en vivo
            if (broadcastRef.current) {
              broadcastRef.current.postMessage({
                type: 'PROFILE_UPDATED',
                displayName: payload.displayName,
                username: payload.username,
                avatarUrl: payload.avatarUrl,
                systemAura: payload.systemAura
              });
            }
            showToast('success', '✓ Cambios guardados y sincronizados con RetroHub.');
          } else {
            showToast('error', data.error ? data.error.message : 'Error al guardar perfil.');
          }
        } catch {
          // Fallback a localStorage
          localStorage.setItem('retrohub_user_name', payload.username);
          localStorage.setItem('retrohub_display_name', payload.displayName);
          localStorage.setItem('retrohub_user_avatar', payload.avatarUrl);
          showToast('success', 'Perfil guardado localmente.');
        } finally {
          setIsSaving(false);
        }
      };

      // Formateador de tiempo al estilo Nintendo Switch OS
      const formatSwitchPlayTime = (minutes) => {
        if (!minutes || minutes < 60) return 'Jugado por primera vez';
        const hours = Math.floor(minutes / 60);
        return `Jugado durante ${hours} horas o más`;
      };

      // Toast feedback
      const showToast = (type, message) => {
        setToast({ type, message });
        setTimeout(() => setToast(null), 3800);
      };

      // Navegar de regreso a la Repisa de Juegos
      const handleReturnToShelf = () => {
        if (window.opener && !window.opener.closed) {
          window.close();
        } else {
          window.location.href = 'index.html';
        }
      };

      const activeAuraData = AURA_PALETTES[profile.systemAura] || AURA_PALETTES.mint;

      return (
        <div className="profile-page-wrapper">
          <input
            type="file"
            ref={fileInputRef}
            style={{ display: 'none' }}
            accept="image/*"
            onChange={handleFileUpload}
          />

          {/* Orbes bioluminiscentes ambientales iiSU */}
          <div className="profile-ambient-orb profile-orb-1" style={{ background: activeAuraData.glow }} />
          <div className="profile-ambient-orb profile-orb-2" />
          <div className="profile-ambient-orb profile-orb-3" />

          {/* Toast Flotante */}
          {toast && (
            <div className={`profile-toast toast-${toast.type}`}>
              <span>{toast.type === 'success' ? '✓' : toast.type === 'error' ? '✗' : 'ℹ'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* BARRA SUPERIOR SWITCH OS (SIN BATERÍA) */}
          <header className="profile-topbar">
            <div className="topbar-left-zone">
              <button className="btn-switch-return" onClick={handleReturnToShelf} title="Volver a la Repisa de Emuladores">
                <span className="cue-circle cue-b">B</span>
                <span>Volver a la Repisa</span>
              </button>

              <div className="topbar-brand-link">
                <div className="topbar-brand-icon">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M7 2h-1a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h1a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm-2 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm1 7H4v-2h2v2z"/>
                    <path d="M17 2h1a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-1a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm2 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-1-7h2V6h-2v2z"/>
                  </svg>
                </div>
                <div>
                  <span className="topbar-brand-title">iiSU RetroHub</span>

                            className="btn-topbar-action"
                            style={{ fontSize: '11.5px', padding: '4px 12px' }}
                            onClick={() => fileInputRef.current?.click()}
                          >
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                              <polyline points="17 8 12 3 7 8"></polyline>
                              <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Subir Archivo</span>
                          </button>
                        </div>

                        <div className="avatar-tabs-nav">
                          <button
                            type="button"
                            className={`avatar-tab-pill ${avatarTabFilter === 'covers' ? 'active' : ''}`}
                            onClick={() => setAvatarTabFilter('covers')}
                          >
                            Portadas Clásicas
                          </button>
                          <button
                            type="button"
                            className={`avatar-tab-pill ${avatarTabFilter === 'consoles' ? 'active' : ''}`}
                            onClick={() => setAvatarTabFilter('consoles')}
                          >
                            Consolas
                          </button>
                          <button
                            type="button"
                            className={`avatar-tab-pill ${avatarTabFilter === 'characters' ? 'active' : ''}`}
                            onClick={() => setAvatarTabFilter('characters')}
                          >
                            Personajes
                          </button>
                        </div>

                        <div className="avatar-stock-grid">
                          {STOCK_AVATARS.filter(a => a.type === avatarTabFilter).map(item => (
                            <div
                              key={item.id}
                              className={`avatar-stock-item ${profile.avatarUrl === item.url ? 'active' : ''}`}
                              onClick={() => handleSelectAvatar(item.url)}
                              title={item.name}
                            >
                              <img src={item.url} className="avatar-stock-thumb" alt={item.name} />
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Selector de Banner Panorámico */}
                      <div>
                        <label className="form-label">Banner Panorámico de Fondo</label>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(110px, 1fr))', gap: '8px', marginTop: '8px' }}>
                          {STOCK_BANNERS.map(b => (
                            <div
                              key={b.id}
                              style={{
                                height: '56px',
                                borderRadius: '8px',
                                overflow: 'hidden',
                                border: profile.bannerUrl === b.url ? '2px solid var(--system-aura-color)' : '1.5px solid rgba(0,0,0,0.1)',
                                cursor: 'pointer'
                              }}
                              onClick={() => handleSelectBanner(b.url)}
                              title={b.name}
                            >
                              <img src={b.url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt={b.name} />
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Columna Derecha: Formulario de Información */}
                    <div>
                      <div className="form-field-group">
                        <label className="form-label">Nombre de Usuario Único (@)</label>
                        <input
                          type="text"
                          className="form-text-input"
                          value={usernameInput}
                          maxLength={24}
                          onChange={handleUsernameChange}
                        />
                        <span style={{ fontSize: '11px', color: usernameValidation.status === 'taken' ? '#ff4757' : 'var(--system-aura-color)' }}>
                          {usernameValidation.message}
                        </span>
                      </div>

                      <div className="form-field-group">
                        <label className="form-label">Nombre Visible Público</label>
                        <input
                          type="text"
                          className="form-text-input"
                          value={profile.displayName}
                          maxLength={32}
                          onChange={(e) => setProfile(p => ({ ...p, displayName: e.target.value }))}
                        />
                      </div>

                      <div className="form-field-group">
                        <label className="form-label">Título Honorífico</label>
                        <input
                          type="text"
                          className="form-text-input"
                          value={profile.titleHonor}
                          maxLength={40}
                          onChange={(e) => setProfile(p => ({ ...p, titleHonor: e.target.value }))}
                        />
                      </div>

                      <div className="form-field-group">
                        <label className="form-label">Consola Predilecta</label>
                        <select
                          className="form-text-input"
                          value={profile.favoriteSystem}
                          onChange={(e) => setProfile(p => ({ ...p, favoriteSystem: e.target.value }))}
                        >
                          <option value="n64">Nintendo 64</option>
                          <option value="snes">Super Nintendo (SNES)</option>
                          <option value="gba">Game Boy Advance</option>
                          <option value="ps1">PlayStation 1</option>
                          <option value="genesis">Sega Genesis / Mega Drive</option>
                          <option value="nes">Nintendo NES</option>
                          <option value="arcade">Arcade MAME</option>
                        </select>
                      </div>

                      <div className="form-field-group">
                        <label className="form-label">Descripción Personal (Bio)</label>
                        <textarea
                          className="form-text-input form-text-area"
                          value={profile.bio}
                          maxLength={350}
                          onChange={(e) => setProfile(p => ({ ...p, bio: e.target.value }))}
                        />
                        <span style={{ fontSize: '11px', color: 'var(--text-dim)', textAlign: 'right' }}>
                          {profile.bio.length} / 350
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ========================================================
                  PESTAÑA 4: LOGROS E INSIGNIAS RETRO
                  ======================================================== */}
              {activeTab === 'logros' && (
                <div className="switch-section-box">
                  <div className="section-header-row">
                    <div className="section-title-wrap">
                      <div className="section-icon-badge">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                          <circle cx="12" cy="8" r="6"></circle>
                          <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                        </svg>
                      </div>
                      <div>
                        <h2 className="section-title">Logros & Medallas RetroHub</h2>
                        <p className="section-subtitle">Recompensas desbloqueadas por horas jugadas, partidas completadas y amigos añadidos</p>
                      </div>
                    </div>
                    <span className="hero-honor-pill" style={{ color: 'var(--gold-accent)', borderColor: 'var(--gold-accent)' }}>
                      ⭐ 5 Desbloqueados
                    </span>
                  </div>

                  <div className="achievements-grid">
                    {RETRO_ACHIEVEMENTS.map(ach => (
                      <div key={ach.id} className={`achievement-card ${!ach.unlocked ? 'locked' : ''}`}>
                        <div className="achievement-icon-box">{ach.icon}</div>
                        <div className="achievement-info">
                          <div className="achievement-title">{ach.title}</div>
                          <div className="achievement-desc">{ach.desc}</div>
                          <span className="achievement-status-badge">
                            {ach.unlocked ? `✓ Desbloqueado (${ach.progress})` : `En progreso: ${ach.progress}`}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </section>
          </main>

          {/* MODAL CÓDIGO QR OFICIAL SWITCH */}
          {showQrModal && (
            <div className="switch-qr-backdrop" onClick={() => setShowQrModal(false)}>
              <div className="switch-qr-box" onClick={(e) => e.stopPropagation()}>
                <button className="btn-qr-close" onClick={() => setShowQrModal(false)}>✕</button>

                <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '20px', fontWeight: 800, color: '#0f172a', marginBottom: '4px' }}>
                  Añadir con Código QR
                </h3>
                <p style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                  Escanea con la cámara de tu smartphone para ver o añadir a @{profile.username}
                </p>

                <div className="qr-matrix-preview">
                  {/* SVG Matriz QR Auténtica */}
                  <svg width="180" height="180" viewBox="0 0 29 29" fill="#0f172a">
                    {/* Position detection patterns */}
                    <rect x="2" y="2" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="3" y="3" width="5" height="5" fill="#ffffff" />
                    <rect x="4" y="4" width="3" height="3" fill="#0f172a" />

                    <rect x="20" y="2" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="21" y="3" width="5" height="5" fill="#ffffff" />
                    <rect x="22" y="4" width="3" height="3" fill="#0f172a" />

                    <rect x="2" y="20" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="3" y="21" width="5" height="5" fill="#ffffff" />
                    <rect x="4" y="22" width="3" height="3" fill="#0f172a" />

                    {/* Data modules */}
                    <rect x="11" y="3" width="2" height="2" />
                    <rect x="15" y="3" width="2" height="2" />
                    <rect x="10" y="6" width="3" height="1" />
                    <rect x="15" y="6" width="2" height="2" />
                    <rect x="4" y="11" width="2" height="2" />
                    <rect x="8" y="11" width="2" height="2" />
                    <rect x="12" y="11" width="4" height="2" />
                    <rect x="18" y="11" width="2" height="2" />
                    <rect x="22" y="11" width="2" height="2" />
                    <rect x="3" y="15" width="2" height="2" />
                    <rect x="7" y="15" width="3" height="2" />
                    <rect x="12" y="15" width="2" height="2" />
                    <rect x="16" y="15" width="4" height="2" />
                    <rect x="22" y="15" width="2" height="2" />
                    <rect x="11" y="19" width="3" height="2" />
                    <rect x="16" y="19" width="2" height="2" />
                    <rect x="21" y="19" width="3" height="2" />
                    <rect x="11" y="23" width="2" height="2" />
                    <rect x="15" y="23" width="4" height="2" />
                    <rect x="21" y="23" width="2" height="2" />
                  </svg>
                </div>

                <div style={{ fontFamily: 'var(--font-display)', fontSize: '18px', fontWeight: 800, color: '#0f172a', marginBottom: '14px' }}>
                  {profile.friendCode}
                </div>

                <div style={{ display: 'flex', gap: '10px' }}>
                  <button className="btn-send-friend-req" onClick={handleCopyFriendCode}>
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ marginRight: '6px' }}>
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copiar Clave
                  </button>
                  <button className="btn-topbar-action" onClick={() => setShowQrModal(false)}>
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('profileRoot'));
    root.render(<ProfileApp />);
  </script>
</body>
</html>
